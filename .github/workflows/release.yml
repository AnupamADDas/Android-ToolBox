name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Icon Assets
        run: |
          python utils/generate_icon.py

      - name: Ensure Platform Tools
        run: |
          if (!(Test-Path "bin\platform-tools\adb.exe")) {
            python -c "from core.adb_locator import locator; locator.download_platform_tools()"
            New-Item -ItemType Directory -Force -Path "bin\platform-tools"
            Copy-Item "$env:LOCALAPPDATA\AndroidToolbox\platform-tools\*" -Destination "bin\platform-tools\" -Recurse -Force
          }

      - name: Build Executable
        run: |
          python build_exe.py

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Android_Toolbox.exe
          name: Android Toolbox ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
